[package]
name = "product_system"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.44.2", features = ["full"] }

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "http_server"
path = "src/bin/http_server.rs"
